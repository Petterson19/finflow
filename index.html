<script>
// ── DATA COM TRATAMENTO DE ERROS ──────────────────────────────────────
function safeLoad(key, fallback) {
    try {
        const item = localStorage.getItem(key);
        return item ? JSON.parse(item) : fallback;
    } catch (e) {
        console.error("Erro ao carregar " + key + ", resetando dados.", e);
        return fallback;
    }
}

let transactions = safeLoad('ff_tx', []);
let bills        = safeLoad('ff_bills', []);
let customCats   = safeLoad('ff_cats', []);

// ... (Restante do seu script original) ...

// ── INIT ROBUSTO ──────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
    try {
        const M=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'],d=new Date();
        const curMonthEl = document.getElementById('currentMonth');
        if(curMonthEl) curMonthEl.textContent = `${M[d.getMonth()]} ${d.getFullYear()}`;
        
        const fDateEl = document.getElementById('fDate');
        if(fDateEl) fDateEl.value = new Date().toISOString().split('T')[0];
        
        populateCatSelect('fCategory');
        renderCatManager();
        renderTx();
        renderCatFilters();
        updateBalance();
        renderCalendar();
        renderNotif();
        setInterval(renderNotif, 60000);
    } catch (err) {
        console.error("Erro fatal na inicialização:", err);
    }
});
</script>
</body>
