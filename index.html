<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinFlow — Orçamento Pessoal</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,300;0,500;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* CSS Otimizado e integrado */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#181c27;--surface2:#1e2334;--surface3:#242840;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#eef0f6;--muted:#8b90a8;--hint:#555c78;
  --income:#3ecf8e;--income-bg:rgba(62,207,142,0.1);
  --expense:#f87171;--expense-bg:rgba(248,113,113,0.1);
  --accent:#7c6af7;--accent-bg:rgba(124,106,247,0.12);
  --warn:#f59e0b;--warn-bg:rgba(245,158,11,0.1);
  --r:14px;--rs:8px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}
header{position:sticky;top:0;z-index:100;background:rgba(15,17,23,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Fraunces',serif;font-size:22px;font-weight:500;letter-spacing:-0.5px}
.logo span{color:var(--accent);font-style:italic}
.header-right{display:flex;align-items:center;gap:10px}
.icon-btn{position:relative;background:var(--surface);border:1px solid var(--border2);border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background 0.15s;font-size:17px}
.icon-btn:hover{background:var(--surface2)}
.notif-badge{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(--expense);color:#fff;font-size:10px;font-weight:500;display:none;align-items:center;justify-content:center;border:2px solid var(--bg)}
.app{max-width:1140px;margin:0 auto;padding:28px 20px 80px}
.hero{background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--border2);border-radius:20px;padding:32px 36px;margin-bottom:24px}
.hero-balance{font-family:'Fraunces',serif;font-size:42px;font-weight:300;margin-bottom:20px}
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.hero-stat{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:var(--rs);padding:14px}
.panel{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:20px;margin-bottom:20px}
.submit-btn{width:100%;padding:12px;border:none;border-radius:var(--rs);font-weight:600;cursor:pointer;margin-top:10px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:#333;padding:12px 20px;border-radius:8px;transition:.3s}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div class="logo">Fin<span>Flow</span></div>
  <div class="header-right">
    <div class="icon-btn" onclick="exportData()">💾</div>
    <div class="icon-btn" onclick="document.getElementById('importFile').click()">📂</div>
    <input type="file" id="importFile" style="display:none" onchange="importData(event)">
  </div>
</header>

<div class="app">
  <div class="hero">
    <div id="heroBalance" class="hero-balance">R$ 0,00</div>
    <div class="hero-stats">
        <div class="hero-stat">Receitas<div id="heroIncome">R$ 0,00</div></div>
        <div class="hero-stat">Despesas<div id="heroExpense">R$ 0,00</div></div>
    </div>
  </div>
  
  <div class="panel">
    <h3>Novo Lançamento</h3>
    <input type="text" id="fDesc" placeholder="Descrição" style="width:100%;padding:8px;margin:10px 0">
    <input type="number" id="fAmount" placeholder="Valor" style="width:100%;padding:8px;margin:10px 0">
    <button class="submit-btn" onclick="addEntry()" style="background:var(--accent);color:white">Adicionar</button>
  </div>

  <div class="panel">
    <h3>Lançamentos</h3>
    <div id="txList"></div>
  </div>
</div>

<div class="toast" id="toast">Operação realizada!</div>

<script>
// ── CARREGAMENTO SEGURO COM TRATAMENTO DE ERROS ───────────────────────
function safeLoad(key, fallback) {
    try {
        const item = localStorage.getItem(key);
        return item ? JSON.parse(item) : fallback;
    } catch (e) {
        console.error("Erro ao carregar localStorage, resetando dados.", e);
        return fallback;
    }
}

let transactions = safeLoad('ff_tx', []);
let bills        = safeLoad('ff_bills', []);
let customCats   = safeLoad('ff_cats', []);

function save() {
    localStorage.setItem('ff_tx', JSON.stringify(transactions));
    localStorage.setItem('ff_bills', JSON.stringify(bills));
    localStorage.setItem('ff_cats', JSON.stringify(customCats));
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}

function addEntry() {
    const desc = document.getElementById('fDesc').value;
    const amount = parseFloat(document.getElementById('fAmount').value);
    if (!desc || !amount) { showToast("Preencha tudo!"); return; }
    
    transactions.unshift({id: Date.now(), desc, amount, type: 'expense', date: new Date().toISOString()});
    save();
    renderTx();
    updateBalance();
    showToast("Adicionado com sucesso!");
}

function updateBalance() {
    const total = transactions.reduce((acc, t) => acc + t.amount, 0);
    document.getElementById('heroBalance').textContent = 'R$ ' + total.toFixed(2);
}

function renderTx() {
    const list = document.getElementById('txList');
    list.innerHTML = transactions.map(t => `
        <div style="padding:10px; border-bottom:1px solid #333">
            ${t.desc} - R$ ${t.amount.toFixed(2)}
        </div>
    `).join('');
}

// ── IMPORT/EXPORT ────────────────────────────────────────────────────
function exportData() {
    const data = JSON.stringify({transactions, bills, customCats});
    const blob = new Blob([data], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'finflow_backup.json';
    a.click();
}

function importData(e) {
    const reader = new FileReader();
    reader.onload = (ev) => {
        try {
            const data = JSON.parse(ev.target.result);
            transactions = data.transactions || [];
            bills = data.bills || [];
            customCats = data.customCats || [];
            save();
            renderTx();
            updateBalance();
            showToast("Importado!");
        } catch (err) { showToast("Arquivo inválido!"); }
    };
    reader.readAsText(e.target.files[0]);
}

// Inicialização
document.addEventListener('DOMContentLoaded', () => {
    renderTx();
    updateBalance();
});
</script>
</body>
</html>
