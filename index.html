<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinFlow — Orçamento Pessoal</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,300;0,500;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <div class="logo">Fin<span>Flow</span></div>
  <div class="header-right">
    <div class="month-tag" id="currentMonth"></div>
    <button class="icon-btn" onclick="AppUtils.exportData()" title="Exportar dados" aria-label="Exportar dados">💾</button>
    <label class="icon-btn" title="Importar dados" style="cursor:pointer" aria-label="Importar dados">
      📂<input type="file" id="importFile" accept=".json" style="display:none" onchange="AppUtils.importData(event)">
    </label>
    <button class="icon-btn" onclick="NotificationManager.toggle()" title="Notificações" aria-label="Abrir notificações">
      🔔<span class="notif-badge" id="notifBadge"></span>
    </button>
  </div>
</header>

<!-- NOTIF PANEL -->
<div class="notif-overlay" id="notifOverlay" role="dialog" aria-label="Notificações">
  <div class="notif-panel" id="notifPanel">
    <div class="notif-title">🔔 Notificações</div>
    <div id="notifList"></div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="overlay" id="editOverlay" role="dialog" aria-label="Editar lançamento">
  <div class="modal">
    <div class="modal-title">✏️ Editar lançamento<button class="modal-close" onclick="TransactionManager.closeEdit()" aria-label="Fechar">×</button></div>
    <input type="hidden" id="editId">
    <div class="form-row"><label for="editDesc">Descrição</label><input type="text" id="editDesc" maxlength="50"></div>
    <div class="g2">
      <div class="form-row"><label for="editAmount">Valor (R$)</label><input type="number" id="editAmount" min="0" step="0.01"></div>
      <div class="form-row"><label for="editDate">Data</label><input type="date" id="editDate"></div>
    </div>
    <div class="form-row"><label for="editCat">Categoria</label><select id="editCat"></select></div>
    <div class="modal-actions">
      <button class="submit-btn btn-accent" style="flex:1" onclick="TransactionManager.saveEdit()">Salvar</button>
      <button class="submit-btn" style="flex:0 0 auto;padding:12px 16px;background:var(--surface2);color:var(--muted);border:1px solid var(--border2)" onclick="TransactionManager.closeEdit()">Cancelar</button>
    </div>
  </div>
</div>

<div class="app">
  <div class="hero">
    <div class="hero-label">Saldo atual</div>
    <div class="hero-balance" id="heroBalance">R$ 0,00</div>
    <div class="hero-stats">
      <div class="hero-stat"><div class="hsl">↑ Receitas</div><div class="hsv" style="color:var(--income)" id="heroIncome">R$ 0,00</div></div>
      <div class="hero-stat"><div class="hsl">↓ Despesas</div><div class="hsv" style="color:var(--expense)" id="heroExpense">R$ 0,00</div></div>
      <div class="hero-stat"><div class="hsl">📅 A pagar</div><div class="hsv" style="color:var(--warn)" id="heroBills">R$ 0,00</div></div>
      <div class="hero-stat projected"><div class="hsl" style="color:var(--accent)">◎ Saldo projetado</div><div class="hsv" id="heroProjected">R$ 0,00</div></div>
    </div>
  </div>

  <div class="main-grid">

    <!-- LEFT COLUMN -->
    <div style="display:flex;flex-direction:column;gap:20px">

      <!-- TRANSACTIONS -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">Lançamentos</div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="panel-badge" id="txCount">0 lançamentos</span>
            <div class="view-toggle">
              <button class="vtbtn active" id="vt-list" onclick="TransactionManager.setView('list',this)" title="Lista" aria-label="Visualizar como lista">☰</button>
              <button class="vtbtn" id="vt-pie"  onclick="TransactionManager.setView('pie',this)"  title="Gráfico" aria-label="Visualizar como gráfico">◔</button>
            </div>
          </div>
        </div>

        <!-- LIST VIEW -->
        <div id="txListView">
          <div class="tx-filters" id="typeFilters"></div>
          <div class="tx-filters" id="catFilters" style="padding-top:8px;padding-bottom:12px"></div>
          <div class="tx-list">
            <div id="txList"><div class="empty"><div>💸</div>Nenhum lançamento ainda</div></div>
          </div>
        </div>

        <!-- PIE VIEW -->
        <div id="txPieView" style="display:none">
          <div class="chart-wrap">
            <div class="chart-tabs">
              <button class="ctab active" onclick="TransactionManager.setChartType('expense',this)">Despesas</button>
              <button class="ctab" onclick="TransactionManager.setChartType('income',this)">Receitas</button>
            </div>
            <div class="pie-row">
              <svg id="pieSvg" width="160" height="160" viewBox="0 0 160 160" style="flex-shrink:0" aria-label="Gráfico de distribuição"></svg>
              <div class="pie-legend" id="pieLegend"></div>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- RIGHT COLUMN -->
    <div style="display:flex;flex-direction:column;gap:20px">

      <!-- FORM -->
      <div class="panel">
        <div class="panel-header"><div class="panel-title">Novo lançamento</div></div>
        <div class="form-body">
          <div class="form-tabs">
            <button class="tab-btn ti" onclick="FormManager.setTab('income',this)">+ Receita</button>
            <button class="tab-btn" onclick="FormManager.setTab('expense',this)">− Despesa</button>
            <button class="tab-btn" onclick="FormManager.setTab('bill',this)">📅 Conta</button>
          </div>
          <div class="form-row"><label for="fDesc">Descrição</label><input type="text" id="fDesc" placeholder="Ex: Salário, Aluguel..." maxlength="50"></div>
          <div class="g2">
            <div class="form-row"><label for="fAmount">Valor (R$)</label><input type="number" id="fAmount" placeholder="0,00" min="0" step="0.01"></div>
            <div class="form-row"><label id="dateLabel" for="fDate">Data</label><input type="date" id="fDate"></div>
          </div>
          <div class="form-row"><label for="fCategory">Categoria</label><select id="fCategory" onchange="FormManager.onCatChange(this)"></select></div>
          <div class="form-row" id="outroCatRow" style="display:none">
            <label>Nome da nova categoria</label>
            <div style="display:flex;gap:8px">
              <input type="text" id="outroCatEmoji" class="cat-emoji-input" placeholder="🏷️" maxlength="2" style="flex:0 0 52px">
              <input type="text" id="outroCatName" placeholder="Ex: Streaming, Academia..." maxlength="24" style="flex:1">
              <button class="cat-add-btn" onclick="FormManager.saveOutroCategory()">Criar</button>
            </div>
          </div>
          <div class="form-row" id="billRepeatRow" style="display:none">
            <label for="fRepeat">Recorrência</label>
            <select id="fRepeat"><option value="once">Única vez</option><option value="monthly">Mensal</option></select>
          </div>
          <button class="submit-btn btn-i" id="submitBtn" onclick="FormManager.addEntry()">Adicionar Receita</button>
          <button class="cat-manager-toggle" onclick="CategoryManager.toggle()" type="button">⚙️ Gerenciar categorias</button>
          <div class="cat-manager" id="catManager">
            <div style="font-size:11px;color:var(--muted);margin-bottom:8px">Categorias existentes:</div>
            <div class="cat-list-manage" id="catListManage"></div>
            <div style="font-size:11px;color:var(--muted);margin-bottom:8px;margin-top:4px">Nova categoria <span id="catTypeHint" style="color:var(--accent)">(receita)</span>:</div>
            <div class="cat-add-row">
              <input type="text" id="newCatEmoji" class="cat-emoji-input" placeholder="🏷️" maxlength="2">
              <input type="text" id="newCatName" placeholder="Nome da categoria" maxlength="24">
              <button class="cat-add-btn" onclick="CategoryManager.add()">Criar</button>
            </div>
          </div>
        </div>
      </div>

      <!-- BILLS CALENDAR -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">Contas a pagar</div>
          <span class="panel-badge" id="billCount">0 contas</span>
        </div>
        <div class="cal-wrap">
          <div class="cal-nav">
            <button class="cal-nav-btn" onclick="CalendarManager.move(-1)" aria-label="Mês anterior">‹</button>
            <span class="cal-month-label" id="calLabel"></span>
            <button class="cal-nav-btn" onclick="CalendarManager.move(+1)" aria-label="Próximo mês">›</button>
          </div>
          <div class="cal-grid" id="calGrid"></div>
          <div id="dayDetail"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Scripts -->
<script src="js/storage.js"></script>
<script src="js/utils.js"></script>
<script src="js/categories.js"></script>
<script src="js/transactions.js"></script>
<script src="js/calendar.js"></script>
<script src="js/notifications.js"></script>
<script src="js/form.js"></script>
<script src="js/main.js"></script>

</body>
</html>
